<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- user-scalable=no: pellizcar para hacer zoom tiene sentido en una
    página web, no en una app — en Android permitía descuadrar todo el
    layout con un gesto sin querer (reportado jugando con la app). No afecta
    el zoom con Ctrl+rueda de Electron/desktop, que es un feature del
    navegador aparte de este viewport meta. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FlashLab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
